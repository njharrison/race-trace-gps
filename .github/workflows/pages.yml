name: Publish development card to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - race-trace-gps.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp race-trace-gps.js _site/race-trace-gps.js
          echo 'Race Trace GPS development module' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
